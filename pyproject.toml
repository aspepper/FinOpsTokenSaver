[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finops-token-saver"
version = "0.1.0"
description = "Lightweight AI gateway focused on token cost savings and resilience."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "asyncpg>=0.29,<1.0",
    "fastapi>=0.111,<1.0",
    "redis>=5.0,<6.0",
    "uvicorn[standard]>=0.29,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.4,<1.0",
]

[project.scripts]
finops-token-saver = "finops_token_saver.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
